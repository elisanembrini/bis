name: bis-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  FRONTEND_BASE_URL: https://${DOMAIN}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/auth/google/callback
  PHOTOS_DIR: /data/photos

x-backup-environment: &backup-environment
  PGHOST: db
  PGUSER: ${POSTGRES_USER}
  PGPASSWORD: ${POSTGRES_PASSWORD}
  PGDATABASE: ${POSTGRES_DB}
  POSTGRES_DB: ${POSTGRES_DB}
  RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
  BACKUP_PING_URL: ${BACKUP_PING_URL:-}

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    image: bis-prod-backend:${IMAGE_TAG:-local}
    restart: "no"
    logging: *logging
    <<: *security
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: bis-prod-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *logging
    <<: *security
    environment: *backend-environment
    volumes:
      - photos-data:/data/photos
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  photo-cleaner:
    image: bis-prod-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *logging
    <<: *security
    command:
      - sh
      - -c
      - while true; do python -m scripts.cleanup_photos && touch /tmp/heartbeat; sleep 3600; done
    environment: *backend-environment
    volumes:
      - photos-data:/data/photos
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/heartbeat -mmin -150 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  caddy:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.prod
    image: bis-prod-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backup:
    build:
      context: ./deploy/backup
    image: bis-prod-backup:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *logging
    <<: *security
    user: "10001:10001"
    environment: *backup-environment
    volumes:
      - photos-data:/data/photos:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/heartbeat -mmin -3 2>/dev/null)\" && test ! -e /tmp/failed"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  restore:
    image: bis-prod-backup:${IMAGE_TAG:-local}
    profiles: ["tools"]
    restart: "no"
    logging: *logging
    <<: *security
    user: "10001:10001"
    environment: *backup-environment
    volumes:
      - photos-data:/data/photos
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  photos-data:
  caddy-data:
  caddy-config:
