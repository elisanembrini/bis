name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg://bis:bis@localhost:5432/bis
  TEST_DATABASE_URL: postgresql+psycopg://bis:bis@localhost:5432/bis_test
  FRONTEND_BASE_URL: http://localhost:5173
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_SECURITY: none
  SMTP_FROM: Bis <noreply@bis.local>
  PHOTOS_DIR: /tmp/photos

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bis
          POSTGRES_PASSWORD: bis
          POSTGRES_DB: bis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bis -d bis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: uv sync --frozen
        working-directory: apps/backend
      - run: uv run python -m scripts.export_openapi
        working-directory: apps/backend
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
        working-directory: apps/frontend
      - run: git diff --exit-code openapi.json apps/frontend/src/api/generated/schema.d.ts

  production:
    name: Production setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x --source-path=SCRIPTDIR deploy/*.sh deploy/backup/*.sh
      - run: docker compose --env-file .env.production.example -f docker-compose.prod.yml --profile tools config --quiet
      - run: docker compose --env-file .env.production.example -f docker-compose.prod.yml build

  e2e:
    name: End to end
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bis-e2e exec playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
